# METOR on VidOR -- the paper's recipe, differing from VidVRD only where the
# paper says it differs.
#
# NOTE: VidOR data is not present in this workspace. This config is written from
# the paper so the setting is recorded, not because it can be run here. See
# docs/00_Reconstruction-notes.md section "What cannot be run".

arch: metor
dataset: vidor

n_queries: 100
n_iter: 3                 # "set to two for VidVRD and three for VidOR"
alpha: 0.9
theta_traj: 1.0
theta_ctx: 0.2
theta_cst: 0.1

clip_len: 30
frame_stride: 30

lr: 1.0e-4
max_epoch: 30
batch_size: 1
optimizer: adamw
lr_milestones: [15, 20, 25]
lr_gamma: 0.1

traj_score_threshold: 0.2
box_filter_threshold: 0.35

clip_backbone: "ViT-L/14@336px"
cre_mode: inject

ps: metor_vidor
